name: Deploy MkDocs documentation

# Build the mkdocs-material documentation with mike and deploy it to the
# gh-pages branch (same approach as the upstream lighthouse docs).
#
# Prerequisite: repository Settings → Pages → Source: "Deploy from a branch",
# Branch: gh-pages, path: / (root). The site lives at
# https://go-oidfed.github.io/lighthouse-light/ (see site_url in mkdocs.yml).

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
    tags:
      - 'v*'

permissions:
  contents: write  # Needed to push to gh-pages

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # mike needs full history for gh-pages branch

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MkDocs and mike
        run: |
          pip install "mkdocs>=1.6" "mkdocs-material>=9.5" mike

      - name: Configure git for mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy docs (main)
        run: |
          mike deploy --push main
          mike set-default --push main

      - name: Deploy docs (versioned release tag)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          MINOR="${VERSION%.*}"
          mike deploy --push "${VERSION}" "${MINOR}" --update-aliases
          mike set-default --push main
